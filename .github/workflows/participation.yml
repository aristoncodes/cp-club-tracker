name: participation
on:
  workflow_dispatch:
    inputs:
      platform:
        required: true
      contest:
        required: true
      alt:
        required: false
      start:
        required: false
      end:
        required: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --filter jobs...
      - run: pnpm --filter jobs participation
        env:
          API_URL: ${{ secrets.API_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          PLATFORM: ${{ inputs.platform }}
          CONTEST: ${{ inputs.contest }}
          ALT: ${{ inputs.alt }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
