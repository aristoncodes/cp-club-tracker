name: sync-solves
on:
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        platform: [cc, leetcode, atcoder]
    # One run per platform at a time; a slow CodeChef run no longer holds up the others.
    concurrency:
      group: sync-solves-${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --filter jobs...
      - run: pnpm --filter jobs sync-solves
        env:
          API_URL: ${{ secrets.API_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          PLATFORM: ${{ matrix.platform }}
