name: build-apk
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install -g eas-cli
      - run: pnpm install --frozen-lockfile
      - name: Build the APK with the signing key stored on Expo
        working-directory: app
        run: eas build --local --platform android --profile preview --non-interactive --output cp-club-tracker.apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - name: Publish the APK for the website's download page
        run: gh release create "apk-${{ github.run_number }}" app/cp-club-tracker.apk --title "App build ${{ github.run_number }}" --notes "Android app, built from ${{ github.sha }}." --latest
        env:
          GH_TOKEN: ${{ github.token }}
